dept44:
  rabbitmq:
    enabled: true
integration:
  rabbitmq:
    # The queue other services' events reach eventlog on, bound to the exchanges they publish them on
    queue: api-fabriken.eventlog.events
logging:
  level:
    root: INFO
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
openapi:
  name: ${spring.application.name}
  title: ${spring.application.name}
  version: '@project.version@'
spring:
  application:
    name: api-eventlog
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      pool-name: eventlog-pool
  flyway:
    enabled: false
  rabbitmq:
    virtual-host: api-fabriken
  jpa:
    properties:
      jakarta:
        persistence:
          schema-generation:
            database:
              action: none
